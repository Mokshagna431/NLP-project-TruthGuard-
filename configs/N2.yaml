name: "N2"
description: "Full TruthGuard system: Hybrid (BM25 + SBERT with RRF) + CrossEncoder Re-ranker + DeBERTa-v3 NLI (V2)"
retriever:
  type: "hybrid"
  dense_model: "sentence-transformers/all-mpnet-base-v2"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  rrf_k: 60
  k_d: 5
  k_s: 5
  gate_tau_r: 0.10
verifier:
  type: "nli" # V2
  model_name: "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli"
  tau_e: 0.70
  tau_c: 0.70
  temperature: 1.0 # tuned with L-BFGS on dev NLL
decomposer:
  type: "atomic_llm"
scoring:
  lambda_nei: 0.5
correction:
  max_rounds: 2
seeds: [42, 123, 999]
